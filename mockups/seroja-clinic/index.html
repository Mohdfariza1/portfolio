<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seroja Beauty · Clinic CRM (demo)</title>
<style>
:root{--shell:#3a1f2d;--shell2:#4a2a3b;--shell-ink:#f7eff2;--shell-mut:#d6c2cb;--ground:#f3f1f2;--card:#fff;--ink:#24181e;--mut:#6a5d63;--line:#e6e0e3;--line2:#d4cbd0;--acc:#8a2f57;--acc-h:#74264a;--acc-soft:#f8ecf1;--bad:#a3352b;--ok:#2f7350;--r:10px}
*{box-sizing:border-box}
html{color-scheme:light;scrollbar-color:#c7b6be transparent;scrollbar-width:thin}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:#efd3df;color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#cdbcc4;border-radius:10px;border:3px solid var(--ground)}
h1{font-size:22px;line-height:1.25;margin:0;font-weight:650;letter-spacing:-.012em;text-wrap:balance}
h2{font-size:16px;line-height:1.3;margin:0;font-weight:650}
h3{font-size:15px;margin:0;font-weight:650}
p{margin:0}
.mut{color:var(--mut)}.small{font-size:13px}
.num,.time{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
a{color:var(--acc);text-underline-offset:3px}
svg{flex:none}

/* shell */
.shell{position:sticky;top:0;z-index:20;background:var(--shell);color:var(--shell-ink)}
.top{display:flex;align-items:center;gap:14px;padding:10px 22px;max-width:1180px;margin:0 auto}
.mark{display:flex;align-items:center;gap:10px;font-weight:650;font-size:17px;letter-spacing:.005em;line-height:1.15}
.mark small{display:block;font-weight:400;font-size:12px;color:var(--shell-mut)}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.25}
.me .role{display:block;color:var(--shell-mut);font-size:12px}
.me .chip{box-shadow:0 0 0 1.5px var(--shell-ink)}
.sbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid #74536a;color:var(--shell-ink);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.sbtn:hover{background:var(--shell2)}
nav.tabs{display:flex;gap:2px;padding:0 12px;max-width:1180px;margin:0 auto}
nav.tabs button{background:none;border:0;color:var(--shell-mut);padding:9px 14px 11px;cursor:pointer;font-size:14px;border-bottom:3px solid transparent;border-radius:0}
nav.tabs button:hover{color:#fff}
nav.tabs button.on{color:#fff;border-bottom-color:#e8afc5;font-weight:600}
nav.tabs button{display:inline-flex;align-items:center;gap:7px}
.nav-ic{display:inline-flex}
.ng,.soon{display:none}
.badge{margin-left:auto;background:#e8afc5;color:var(--shell);font-size:11.5px;font-weight:700;line-height:18px;border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.app.side{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--shell) 236px,transparent 236px)}
.app.side .shell{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto}
.app.side .top{display:contents}
.app.side .mark{order:0;padding:4px 8px 20px}
.app.side nav.tabs{order:1;flex:1;flex-direction:column;gap:2px;padding:0;margin:0;max-width:none}
.app.side .ng{display:block;margin:0;font-size:12px;font-weight:600;color:var(--shell-mut);padding:16px 10px 6px}
.app.side nav.tabs .ng:first-child{padding-top:0}
.app.side nav.tabs button,.app.side .soon{display:flex;align-items:center;gap:11px;padding:9px 10px;border:0;border-radius:8px;text-align:left;font-size:14.5px;color:var(--shell-mut);width:100%}
.app.side nav.tabs button:hover{background:var(--shell2);color:#fff}
.app.side nav.tabs button.on{background:#5b3348;color:#fff;border:0}
.app.side .soon{opacity:.6;cursor:default}
.app.side .soon small{margin-left:auto;font-size:11px}
.app.side .me{order:2;margin:0;flex-wrap:wrap;padding:14px 8px 4px;border-top:1px solid #573849;gap:10px}
.app.side .me .sbtn{width:100%;justify-content:center}
.app.side .work{min-width:0}
.app.side .guide-in,.app.side main{max-width:1180px}

/* guide */
.guide{background:var(--card);border-bottom:1px solid var(--line)}
.guide-in{max-width:1180px;margin:0 auto;padding:9px 22px;display:flex;align-items:center;gap:14px;font-size:14px}
.guide-in p{flex:1;min-width:0}
.guide .dots{display:flex;gap:5px}
.guide.done .guide-in{color:var(--ok)}
.guide.done .guide-in span{display:flex;gap:6px;align-items:center;flex:1}
.as{background:var(--acc-soft);border-bottom:1px solid #ecd3de}
.as-in{max-width:1180px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink)}
.as-in p{flex:1}
.as-in .chip{width:18px;height:18px;border-radius:5px}
@media (max-width:640px){.as-in{padding:9px 14px;font-size:13px;align-items:flex-start}}

main{max-width:1180px;margin:0 auto;padding:22px 22px 56px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head .lead,.lead{font-size:15px;margin-top:6px;max-width:72ch}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
section{margin-top:26px}
.head+section,.head+.panel{margin-top:0}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 10px}
section>.sh:first-child{margin-top:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel>h2{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;align-items:start}
.grid2.one{grid-template-columns:1fr}
.grid2>section{margin-top:0}
.empty{color:var(--mut);padding:14px 0}
.tw{overflow-x:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;font-size:14px;font-weight:560;line-height:1.2;text-decoration:none;color:var(--ink);transition:background-color .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:#faf6f8;border-color:#c2b3ba}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-h);border-color:var(--acc-h)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:12px 18px;font-size:15px;width:100%}
.btn.danger{color:var(--bad)}
.btn.icon{padding:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--acc);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.icon-btn{background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;color:var(--mut);display:inline-flex}
.icon-btn:hover{background:var(--ground);color:var(--ink)}

/* swatch chips: status is the chip's form */
.chip{--sw:#6a5d63;display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid var(--sw);background:#fff;position:relative;vertical-align:-2px;flex:none}
.chip.tiny{width:10px;height:10px;border-radius:3px;vertical-align:-1px}
.chip.big{width:34px;height:42px;border-radius:7px}
.chip.arrived{background:linear-gradient(90deg,var(--sw) 50%,#fff 50%)}
.chip.inprog{background:repeating-linear-gradient(135deg,var(--sw) 0 2.5px,#fff 2.5px 5px)}
.chip.done,.chip.paid{background:var(--sw)}
.chip.paid::after{content:"";position:absolute;left:2px;top:1px;width:5px;height:3px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg)}
.chip.noshow,.chip.cancel{border-style:dashed;--sw:#a2949b}
.chip.noshow::after{content:"";position:absolute;left:-3px;right:-3px;top:4px;height:2px;background:#a2949b;transform:rotate(-45deg)}
.stl{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--acc-soft);color:var(--acc);vertical-align:1px;white-space:nowrap}

/* day strip */
.strip-scroll{overflow-x:auto}
.strip{min-width:640px}
.hours,.lane{display:grid;grid-template-columns:132px 1fr}
.hrow{position:relative;height:18px;font-size:11px;color:var(--mut)}
.hrow span{position:absolute;transform:translateX(-50%)}
.hrow span:first-child{transform:none}
.lane{align-items:center;min-height:50px;border-top:1px solid var(--line)}
.lane-name{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;line-height:1.2}
.lane-name .sw{font-weight:400;font-size:12px;display:block}
.track{position:relative;height:40px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100%/12))}
.bk{--sw:#6a5d63;position:absolute;top:5px;height:30px;border-radius:6px;border:2px solid var(--sw);background:#fff;font-size:12px;padding:0 6px;display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;cursor:pointer;color:var(--ink);text-align:left;min-width:0}
.bk .t{font-variant-numeric:tabular-nums;font-weight:600}
.bk.arrived{background:linear-gradient(90deg,color-mix(in srgb,var(--sw) 30%,#fff) 50%,#fff 50%)}
.bk.inprog{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--sw) 24%,#fff) 0 5px,#fff 5px 10px)}
.bk.done,.bk.paid{background:var(--sw);color:#fff}
.bk.paid{background:color-mix(in srgb,var(--sw) 78%,#000)}
.bk.paid::before{content:"";flex:none;width:7px;height:3.5px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg);margin:0 1px 3px 1px}
.bk .nm.hide{display:none}
.bk.noshow{border-style:dashed;--sw:#a2949b;color:var(--mut);text-decoration:line-through}
.bk:hover{filter:brightness(.96)}
.bk.lit{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--acc);animation:lit 1.8s cubic-bezier(.2,.8,.2,1) 3}
@keyframes lit{50%{box-shadow:0 0 0 2px #fff,0 0 0 8px rgba(138,47,87,.22)}}
.nowline{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--acc);pointer-events:none;z-index:2}
.lanepick{display:none}
.lane-name,.hours>div:first-child{position:sticky;left:0;z-index:3;background:var(--card);align-self:stretch;display:flex;align-items:center}
.strip-scroll.scrolled .lane-name{box-shadow:8px 0 8px -6px rgba(36,24,30,.25)}

/* rows */
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) 168px auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;font-size:14px}
.rows>.row:first-child{border-top:0;border-radius:var(--r) var(--r) 0 0}
.rows>.row:last-child{border-radius:0 0 var(--r) var(--r)}
.row.lit{background:var(--acc-soft)}
.row.dim .who b,.row.dim .name{color:var(--mut)}
.time{display:flex;flex-direction:column;line-height:1.25}
.time span{font-size:12px}
.who{display:flex;flex-direction:column;gap:2px;min-width:0}
.who>span{font-size:13px}
.name{background:none;border:0;padding:0;font-weight:650;cursor:pointer;text-align:left;font-size:15px}
.name:hover{color:var(--acc);text-decoration:underline;text-underline-offset:3px}
.row .acts{justify-content:flex-end}
.warn{color:var(--bad);font-size:13px;display:flex;gap:6px;align-items:flex-start;line-height:1.35}
.warn svg{margin-top:1px}
.crow{grid-template-columns:minmax(0,1.3fr) 1fr minmax(0,1.3fr) 130px;cursor:pointer}
.crow:hover{background:#fbf8f9}
.plate{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.plate .mut{font-size:13px}

/* filters */
.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:0 10px;flex:1;min-width:220px;max-width:380px;color:var(--mut)}
.search input{border:0;margin:0;padding:9px 0;outline:none;background:none}
.search:focus-within{outline:2px solid var(--acc);border-color:var(--acc)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;color:var(--mut);font-weight:600}
.tbl th:first-child,.tbl td:first-child{padding-left:0}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl .num{text-align:right}
.tbl tr:last-child td{border-bottom:0}
.tbl.click tbody tr{cursor:pointer}
.tbl.click tbody tr:hover td{background:#fbf8f9}
.tbl tr.void td{color:var(--mut);text-decoration:line-through}
.tbl tr.tot td{font-weight:650;border-top:1px solid var(--ink)}
.pin{width:96px;margin:0;padding:5px 8px;text-align:right}

/* owner */
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.todo li:first-child{border-top:0;padding-top:0}
.staff{list-style:none;margin:0 0 6px;padding:0}
.staff li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.staff li:first-child{border-top:0}
.staff li>span{display:flex;flex-direction:column;line-height:1.3}
.staff .mut{font-size:12px}

/* beautician cards */
.cards{display:grid;gap:12px;margin-top:16px}
.tcard{display:grid;grid-template-columns:70px 1fr auto;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;align-items:start}
.tcard.done,.tcard.paid{background:#faf8f9}
.tc-time{display:flex;flex-direction:column;line-height:1.25}
.tc-time b{font-size:17px}
.tc-time span{font-size:13px;color:var(--mut)}
.tc-body{display:flex;flex-direction:column;gap:5px;min-width:0}
.tc-body h3{font-size:17px}
.tc-act{display:flex;flex-direction:column;align-items:flex-end;gap:10px}

/* client page */
.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:12px;text-decoration:none}
.plate.big{gap:5px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.hist li:first-child{border-top:0;padding-top:0}
.hist li>span:last-child{display:flex;flex-direction:column}

/* picker */
.pick{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start;padding-top:34px}
.pick h1{font-size:26px}
.users{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 18px}
.ucard{display:flex;gap:14px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .2s}
.ucard:hover{border-color:#bfaeb6;box-shadow:0 6px 18px -10px rgba(58,31,45,.35)}
.ucard>span{display:flex;flex-direction:column;gap:2px;line-height:1.35}
.ucard b{font-size:16px}
.ucard .mut{font-size:13px}
.ucard .sees{font-size:13px;margin-top:6px}
.diff h2{margin-bottom:6px}
.diff ul{list-style:none;margin:0;padding:0}
.diff li{display:flex;flex-direction:column;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.diff li:first-child{border-top:0}
.diff li span{color:var(--mut);font-size:13px}

/* forms */
label.f,fieldset.f{display:block;margin:0 0 14px;font-size:13px;font-weight:600;border:0;padding:0}
fieldset.f legend{padding:0;margin-bottom:6px}
.f .h{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:4px}
input,select,textarea{font:inherit;font-weight:400;font-size:15px;width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink);caret-color:var(--acc)}
textarea{resize:vertical;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow4{grid-template-columns:2fr 1fr 1fr 1fr}
.pill{position:relative;font-weight:500}
.pill input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.pill>span{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);padding:7px 12px;border-radius:99px;cursor:pointer;font-size:14px;background:#fff}
.pill input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.pill input:checked+span .chip{box-shadow:0 0 0 1.5px #fff}
.pill input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.err{color:var(--bad);font-size:14px;margin:0 0 12px;line-height:1.4}
.err .btn{margin-left:6px;vertical-align:baseline}
.inline{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.inline h3{margin-bottom:10px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(36,24,30,.36)}
#sheet[hidden]{display:none}
.sheet{background:#fff;width:min(470px,100%);height:100%;overflow:auto;padding:18px 22px 28px;box-shadow:-10px 0 34px rgba(36,24,30,.2);animation:slin .24s cubic-bezier(.16,1,.3,1)}
@keyframes slin{from{transform:translateX(28px);opacity:.5}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
.sheet-h h2{font-size:19px;padding-top:4px}
.sheet>p.mut{margin-bottom:16px}
.dl{display:grid;grid-template-columns:104px 1fr;gap:8px 12px;margin:16px 0 20px;font-size:14px}
.dl dt{color:var(--mut)}.dl dd{margin:0}
.acts.wrap{margin-top:6px}
.lines{margin:10px 0 14px;border-top:1px solid var(--line)}
.line{display:grid;grid-template-columns:1fr 64px 80px 32px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.line>span{display:flex;flex-direction:column;line-height:1.3}
.line b{text-align:right}
.qty{margin:0;padding:6px 8px;text-align:center}
.paybar{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 12px;border-top:1px solid var(--ink);margin-top:6px}
.paybar b{font-size:22px}
.receipt{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0 16px}
.receipt.void{opacity:.75}
.receipt>p{margin-bottom:6px}
.receipt .tbl{margin:8px 0}
.tbl.imp tr.skip td{color:var(--mut)}
.tbl.imp{margin-bottom:16px}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--shell);color:var(--shell-ink);padding:11px 16px;border-radius:10px;box-shadow:0 10px 30px -8px rgba(36,24,30,.45);display:flex;gap:16px;align-items:center;font-size:14px;max-width:min(560px,calc(100% - 24px))}
#toast[hidden]{display:none}
#toast .link{color:#f2bfd3;font-weight:600}

@media (max-width:1100px) and (min-width:641px){
  .app.side{grid-template-columns:76px minmax(0,1fr);background:linear-gradient(90deg,var(--shell) 76px,transparent 76px)}
  .app.side .shell{padding:14px 10px;align-items:center}
  .app.side .mark{padding:4px 0 18px}
  .app.side .mark>div,.app.side .ng,.app.side .lbl,.app.side .me>div,.app.side .soon small{display:none}
  .app.side nav.tabs{align-items:center;gap:4px}
  .app.side nav.tabs button,.app.side .soon{justify-content:center;width:52px;padding:10px;position:relative}
  .app.side .badge{position:absolute;top:1px;right:1px;margin:0;padding:0 5px;font-size:10.5px;line-height:16px;min-width:16px}
  .app.side .me{justify-content:center;padding:12px 0 0}
  .app.side .me .sbtn{width:auto;padding:8px}
}
@media (max-width:860px){
  .grid2{grid-template-columns:1fr}

let S,V={tab:null,date:TODAY,sdate:TODAY,cid:null,q:'',cf:'all',lane:null,duo:!PHONE&&localStorage.getItem('seroja-duo')==='1'},M=null,UNDO=null,tT;

const save=()=>{const me=S.me;if(PHONE){try{S.me=JSON.parse(localStorage.getItem(KEY)).me}catch(e){S.me=null}}localStorage.setItem(KEY,JSON.stringify(S));S.me=me};
const endOf=b=>fromMin(toMin(b.time)+item(b.tid).mins);

function makeSale(o){
  const total=Math.max(0,o.lines.reduce((a,l)=>a+l.price*l.qty,0)-(o.disc||0));
  S.seq++;
  const s={id:nid('s'),no:'DD'+String(1000+S.seq),cid:o.cid||'',date:o.date||TODAY,time:o.time||nowHM(),lines:o.lines,disc:o.disc||0,total,method:o.method,staff:o.staff,by:o.by,bid:o.bid||'',void:false};

function seed(){
  let r=11;const rnd=()=>(r=r*16807%2147483647)/2147483647;const pick=a=>a[Math.floor(rnd()*a.length)];
  const users=[{id:'u1',name:'Puan Sarah',role:'owner',sw:'Berry 01',c:'#7a2e52'},{id:'u2',name:'Aina',role:'kaunter',sw:'Sand 02',c:'#8a6f4f'},{id:'u3',name:'Mira',role:'beautician',sw:'Rose 03',c:'#a9505f'},{id:'u4',name:'Farah',role:'beautician',sw:'Clay 07',c:'#8e5a33'}];
  const items=[{id:'t1',name:'Facial Basic',type:'rawatan',price:120,mins:60},{id:'t2',name:'Hydra Facial',type:'rawatan',price:280,mins:90},{id:'t3',name:'Chemical Peel',type:'rawatan',price:220,mins:45},{id:'t4',name:'HIFU Face',type:'rawatan',price:1200,mins:90},{id:'t5',name:'Pigmentation Laser',type:'rawatan',price:350,mins:60},{id:'t6',name:'Fat Melting (tummy)',type:'rawatan',price:450,mins:60},{id:'p1',name:'Serum Vitamin C 30ml',type:'produk',price:89},{id:'p2',name:'Sunscreen SPF50',type:'produk',price:65},{id:'p3',name:'Gentle Face Cleanser',type:'produk',price:48}];
  const m=pad(new Date().getMonth()+1);
  const C=[['Nur Alia Syafiqah','012-338 4102','1995-02-14',''],['Siti Khadijah Omar','013-772 9054','1990-07-03','Allergic to vitamin C'],['Aina Sofea','017-245 8810','',''],['Puteri Balqis','019-660 3127','1988-11-21',''],['Amira Natasha','011-2093 4471','1997-'+m+'-09','Sensitive skin, avoid strong peels'],['Hani Farhana','012-904 6635','1993-'+m+'-27',''],['Syazwani Aziz','014-318 2290','',''],['Liyana Rosli','016-551 7408','1999-04-30',''],['Nadia Zulkifli','018-237 6619','1992-09-12','5 months pregnant, avoid HIFU and laser'],['Qistina Hakim','013-480 1176','',''],['Izzah Maisarah','019-822 3054','1996-12-05',''],['Fatin Najwa','011-6627 0193','','']];
  S={v:1,me:null,users,items,clients:[],bookings:[],sales:[],seq:0,n:100,ownerSeen:false};
  S.clients=C.map((x,i)=>({id:'c'+(i+1),name:x[0],phone:x[1],dob:x[2],note:x[3],src:'lama',since:addDays(TODAY,-210+i*11)}));
  const beau=['u3','u4'],rw=items.filter(i=>i.type==='rawatan'),pr=items.filter(i=>i.type==='produk');

    for(let k=0;k<n;k++){
      const c=pick(S.clients),it=pick(rw),st=pick(beau),time=fromMin(t);t+=it.mins+30+Math.floor(rnd()*3)*30;
      const b={id:nid('b'),cid:c.id,tid:it.id,staff:st,date,time,status:'paid',note:pick(['Skin fine, no redness','Slight redness, settled','Suggest coming back in 2 weeks','Client happy',''])};

function scrollStrips(){

function parseImport(t){
  const lines=t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines[0]&&/name|nama/i.test(lines[0]))lines.shift();
  const seen=new Set(S.clients.map(c=>c.phone.replace(/\D/g,'')));
  return lines.map(l=>{const [name='',phone='',dob='',note='']=l.split(',').map(x=>x.trim());const d=phone.replace(/\D/g,'');let st='baru';
    if(!name)st='nama';else if(d.length<9)st='phone';else if(seen.has(d))st='ada';else seen.add(d);
    return{name,phone,dob:/^\d{4}-\d{2}-\d{2}$/.test(dob)?dob:'',note,st}});
}

  const R=M.rows,ok=R?R.filter(r=>r.st==='baru').length:0;
  const LBL={baru:'Will be added',ada:'Already exists (same number), skipped',phone:'No phone number, skipped',nama:'No name, skipped'};
  openSheet(`${sh('Import old client list')}<p class="mut" style="margin-top:6px">Export the list from the old system or Excel as CSV. Columns: name, phone, birthday, note.</p>
  ${R?`<table class="tbl imp"><thead><tr><th>Name</th><th>Phone</th><th>Status</th></tr></thead><tbody>${R.map(r=>`<tr class="${r.st==='baru'?'':'skip'}"><td>${esc(r.name)||'—'}</td><td class="num">${esc(r.phone)||'—'}</td><td>${r.st==='baru'?'<b>'+LBL.baru+'</b>':LBL[r.st]}</td></tr>`).join('')}</tbody></table><div class="acts wrap"><button class="btn pri" data-act="doimport"${ok?'':' disabled'}>Import ${ok} clients</button><button class="btn" data-act="imback">Edit list</button></div>`
  :`<label class="f">Choose a CSV file<input type="file" accept=".csv,text/csv" id="impfile"></label><label class="f">Or paste the list<textarea id="imptext" rows="9" spellcheck="false">${esc(M.text)}</textarea><span class="h">A sample is filled in so you can try it straight away.</span></label><button class="btn pri" data-act="imcheck">Check first</button>`}`,first);
}

function confirmSheet(title,body,yes,act,id,extra=''){
  openSheet(`${sh(title)}<p style="margin:10px 0 16px">${body}</p>${extra}<div class="acts"><button class="btn pri" data-act="${act}" data-id="${id}" style="background:var(--bad);border-color:var(--bad)">${yes}</button><button class="btn" data-act="close">Keep it</button></div>`);
}

function setStatus(id,st,msg,undoable){
  const b=findB(id);if(!b)return;const prev={status:b.status,lit:b.lit};
  b.status=st;if(!$('#sheet').hidden)closeSheet();save();render();
  toast(msg,undoable?()=>{b.status=prev.status;b.lit=prev.lit;save();render();toast('Restored.')}:null);
}

const HINTS=[
  ['u2','You are now <b>Aina, Front desk</b>, on the counter laptop. She books clients, charges them and sends receipts.'],
  ['u2','Still <b>Aina, Front desk</b>. She books the client with a beautician. The system stops double bookings.'],
  ['u3','You are now <b>Mira, Beautician</b>, on her phone. She sees only her own clients, their warnings and her own sales.'],
  ['u2','Back to <b>Aina, Front desk</b>. Mira is done with her part and has moved on to her next client. Aina charges and sends the receipt.'],
  ['u1','You are now <b>Puan Sarah, Owner</b>. She sees everything: money, every staff member, settings.']];
function hintBar(){
  if(PHONE)return '';
  if(V.hint===2&&duoOn()&&S.me==='u2')return `<div class="as" role="status"><div class="as-in"><i class="chip done" style="--sw:${user('u3').c}"></i><p>Now look at <b>Mira's phone</b> on the right. She taps <b>Start treatment</b>, then <b>Done</b>. Aina's screen here updates by itself.</p><button class="icon-btn" data-act="hintx" aria-label="Hide">${ic('x',15)}</button></div></div>`;
  if(V.hint==null||!HINTS[V.hint]||HINTS[V.hint][0]!==S.me)return '';
  const u=user(S.me);
  return `<div class="as" role="status"><div class="as-in"><i class="chip done" style="--sw:${u.c}"></i><p>${HINTS[V.hint][1]}</p><button class="icon-btn" data-act="hintx" aria-label="Hide">${ic('x',15)}</button></div></div>`;
}
function step(i){
  V.cid=null;V.date=TODAY;V.sdate=TODAY;V.cf='all';V.q='';V.hint=i;
  const imp=S.clients.find(c=>c.src==='import');
  const viaPhone=i===2&&duoOn();
  S.me=viaPhone?'u2':['u2','u2','u3','u2','u1'][i];V.tab=viaPhone?'booking':['client','booking','hariini','utama','utama'][i];
  save();render();
  if(viaPhone){const ph=$('.ph');ph.classList.remove('ping');void ph.offsetWidth;ph.classList.add('ping')}
  if(i===0)openImport();
  if(i===1)openNew({cid:imp?.id,tid:'t2',staff:'u3',date:TODAY,time:'18:30'});
}

function act(a,id,el,e){
  switch(a){
    case 'hintx':V.hint=null;render();break;
    case 'duo':V.duo=!V.duo;localStorage.setItem('seroja-duo',V.duo?'1':'');render();break;
    case 'login':S.me=id;V.hint=null;V.tab=null;V.cid=null;V.cf='all';V.q='';save();render();window.scrollTo(0,0);break;
    case 'logout':S.me=null;save();render();break;
    case 'reset':localStorage.removeItem(KEY);S=seed();V={tab:null,date:TODAY,sdate:TODAY,cid:null,q:'',cf:'all',lane:null,duo:V.duo};closeSheet();render();toast('Demo reset.');break;
    case 'step':step(+id);break;
    case 'tab':V.tab=id;V.cid=null;closeSheet();render();window.scrollTo(0,0);break;
    case 'lane':V.lane=id;render();break;
    case 'day':V.date=+id===0?TODAY:addDays(V.date,+id);render();break;
    case 'sday':V.sdate=+id===0?TODAY:addDays(V.sdate,+id);render();break;
    case 'cfilter':V.tab='client';V.cid=null;V.cf=id;render();break;
    case 'client':V.tab='client';V.cid=id;closeSheet();render();window.scrollTo(0,0);break;
    case 'back':V.cid=null;render();break;
    case 'bopen':openBooking(id);break;
    case 'barrive':{const b=findB(id);setStatus(id,'arrived',`${esc(cname(b.cid))} has arrived. ${esc(user(b.staff).name)} can see it on her phone.`)}break;
    case 'bnoshow':{const b=findB(id);setStatus(id,'noshow',`${esc(cname(b.cid))} marked as a no-show.`,true)}break;
    case 'bcancel':{const b=findB(id);setStatus(id,'cancel',`Booking for ${esc(cname(b.cid))} at ${b.time} cancelled.`,true)}break;
    case 'bstart':{const b=findB(id);b.lit=true;setStatus(id,'inprog',`Treatment for ${esc(cname(b.cid))} started.`)}break;
    case 'bdone':{const b=findB(id);M={kind:'done',id};openSheet(`${sh('Finish treatment')}<p class="mut">${esc(cname(b.cid))} · ${esc(item(b.tid).name)}</p><form data-form="done" style="margin-top:14px"><label class="f">Treatment note<textarea name="note" rows="3" placeholder="e.g. skin fine, slight redness"></textarea><span class="h">Other beauticians see this note when the client comes back.</span></label><fieldset class="f"><legend>Suggest coming back</legend><div class="seg">${['Not needed','in 2 weeks','in 1 month'].map((x,i)=>`<label class="pill"><input type="radio" name="back" value="${x}"${i===0?' checked':''}><span>${x}</span></label>`).join('')}</div></fieldset><button class="btn pri lg">Mark as done</button></form>`)}break;
    case 'charge':{const b=findB(id);if(b.lit){b.lit=false;save()}openSale({cid:b.cid,bid:b.id,staff:b.staff,lines:[{iid:b.tid,qty:1}]})}break;
    case 'newsale':openSale({cid:id||'',staff:S.me});break;
    case 'newbooking':openNew({cid:id});break;
    case 'newclient':openClient();break;
    case 'editclient':openClient(id);break;
    case 'mline':M.lines.splice(+id,1);drawSale(false);break;
    case 'pay':pay();break;
    case 'receipt':showReceipt(id);break;
    case 'sent':{const s=S.sales.find(x=>x.id===id);s.sent=nowHM();save();setTimeout(()=>showReceipt(id),300)}break;
    case 'print':window.print();break;
    case 'void':confirmSheet('Void this sale?','The sale comes off today\'s total. Its booking goes back to “Done, not paid”.','Yes, void it','voidyes',id,'<label class="f">Reason<input id="voidwhy" placeholder="e.g. wrong price entered"></label>');break;
    case 'voidyes':{const s=S.sales.find(x=>x.id===id);s.void=true;s.voidWhy=($('#voidwhy')?.value||'').trim();const b=s.bid&&findB(s.bid);if(b){b.status='done';b.saleId=''}closeSheet();save();render();toast(`Sale ${s.no} voided.`,()=>{s.void=false;if(b){b.status='paid';b.saleId=s.id}save();render();toast('Sale restored.')})}break;
    case 'delclient':{const c=client(id);confirmSheet(`Delete ${esc(c.name)}?`,'The client disappears from the list. Their sales stay in the reports. You can Undo right after deleting.','Yes, delete','delyes',id)}break;
    case 'delyes':{const i=S.clients.findIndex(c=>c.id===id),c=S.clients[i];S.clients.splice(i,1);V.cid=null;closeSheet();save();render();toast(`${esc(c.name)} deleted.`,()=>{S.clients.splice(i,0,c);save();render();toast('Client restored.')})}break;
    case 'import':openImport();break;
    case 'imcheck':M.text=$('#imptext').value;M.rows=parseImport(M.text);drawImport(false);break;
    case 'imback':M.rows=null;drawImport(false);break;
    case 'doimport':{const ok=M.rows.filter(r=>r.st==='baru'),skip=M.rows.length-ok.length;ok.forEach(r=>S.clients.push({id:nid('c'),name:r.name,phone:r.phone,dob:r.dob,note:r.note,src:'import',since:TODAY}));closeSheet();V.tab='client';V.cid=null;V.cf='import';V.q='';save();render();toast(`${ok.length} clients added.${skip?` ${skip} skipped (same number or incomplete).`:''}`)}break;
    case 'usetime':syncBooking(el.form);M.time=id;M.err='';drawBooking(false);break;
    case 'close':closeSheet();break;
    case 'undo':if(UNDO){const f=UNDO;UNDO=null;$('#toast').hidden=true;f()}break;
  }
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){if(e.target.id==='sheet')closeSheet();return}
  if(t.tagName!=='A')e.preventDefault();
  act(t.dataset.act,t.dataset.id,t,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
  if(e.key==='Enter'&&e.target.matches('tr[data-act]'))e.target.click();
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,k=f.dataset.form;
  if(k==='booking')saveBooking(f);
  if(k==='client')saveClient(f);
  if(k==='done'){const b=findB(M.id),n=f.elements.note.value.trim(),back=f.querySelector('[name=back]:checked').value;b.note=(n||'Done')+(back!=='Not needed'?` Suggest coming back ${back}.`:'');b.status='done';b.lit=true;closeSheet();save();render();toast(`Done. Front desk can now charge ${esc(cname(b.cid))}.`)}
  if(k==='additem'){const v=x=>f.elements[x].value.trim();if(!v('name')||v('price')==='')return;const type=v('type');S.items.push({id:nid(type==='rawatan'?'t':'p'),name:v('name'),type,price:Math.max(0,+v('price')),mins:type==='rawatan'?Math.max(15,+v('mins')||60):0});save();render();toast(`${esc(v('name'))} added to the price list.`)}
  if(k==='addstaff'){const name=f.elements.name.value.trim();if(!name)return;const sw=f.querySelector('[name=sw]:checked').value;S.users.push({id:nid('u'),name,role:f.elements.role.value,sw,c:SWATCH.find(s=>s[0]===sw)[1]});save();render();toast(`${esc(name)} added with swatch ${sw}. They can log in now.`)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.price){const i=item(t.dataset.price);i.price=Math.max(0,Math.round(+t.value||0));save();toast(`${esc(i.name)} is now ${RM(i.price)}. Old sales keep the old price.`)}
  if(t.id==='impfile'&&t.files[0]){const r=new FileReader();r.onload=()=>{M.text=String(r.result);$('#imptext').value=M.text};r.readAsText(t.files[0])}
  if(!M)return;
  if(M.kind==='booking'&&t.dataset.m==='bcid'){syncBooking(t.form);M.err='';drawBooking(false)}
  if(M.kind==='sale'){
    const k=t.dataset.m;
    if(k==='cid')M.cid=t.value;
    if(k==='staff')M.staff=t.value;
    if(k==='method')M.method=t.value;
    if(k==='add'&&t.value){const ex=M.lines.find(l=>l.iid===t.value);if(ex)ex.qty++;else M.lines.push({iid:t.value,qty:1});M.err='';drawSale(false)}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){V.q=t.value;$('#clist').innerHTML=clientList();return}
  if(M?.kind==='sale'){
    if(t.dataset.m==='disc'){M.disc=Math.max(0,+t.value||0);refreshTotals()}
    if(t.dataset.mq!==undefined){M.lines[+t.dataset.mq].qty=Math.max(1,Math.round(+t.value||1));refreshTotals()}
  }
});

let rzT;addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(scrollStrips,120)});
addEventListener('storage',e=>{
  if(e.key!==KEY)return;
  const me=S.me;S=load();S.me=me;UNDO=null;$('#toast').hidden=true;render();
});
S=load();if(PHONE)S.me=PHONE;render();
</script>
</body>
</html>
