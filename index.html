<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio Management System — Mohd Farizal Roslie</title>
<meta name="description" content="Web development, internal business systems and digital advertising portfolio of Mohd Farizal Roslie, Bejaa Digital." />
<style>
  :root{
    --brand:#0d6b62;
    --brand-2:#14a08f;
    --brand-3:#3fd6c4;
    --ink:#14181f;
    --bg:#f2f5f7;
    --card:#ffffff;
    --text:#232a33;
    --muted:#6b7683;
    --line:#e2e8ec;
    --soft:#eef4f4;
    --amber:#b8770a;
    --amber-bg:#fdf3dd;
    --green:#166534;
    --green-bg:#dcf0e2;
    --blue:#1d4ed8;
    --blue-bg:#e0e8fd;
    --grey:#4b5563;
    --grey-bg:#e9edf1;
    --shadow:0 1px 2px rgba(20,24,31,.05), 0 6px 20px rgba(20,24,31,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    background:var(--bg); color:var(--text); font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--brand); text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}

  /* ── LAYOUT ── */
  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:252px; flex-shrink:0; position:fixed; top:0; bottom:0; left:0; z-index:60;
    background:linear-gradient(165deg,#0d6b62 0%,#0f8577 45%,#12a793 100%);
    color:#fff; display:flex; flex-direction:column; overflow-y:auto;
  }
  .brandbox{display:flex; align-items:center; gap:12px; padding:22px 20px; border-bottom:1px solid rgba(255,255,255,.16);}
  .brandbox .mark{
    width:44px; height:44px; flex-shrink:0; border-radius:12px; background:#fff; color:var(--brand);
    display:flex; align-items:center; justify-content:center;
    font-family:Georgia,serif; font-weight:700; font-size:16px; letter-spacing:.5px;
  }
  .brandbox .who{line-height:1.3; min-width:0; overflow-wrap:anywhere;}
  .brandbox .who b{display:block; font-size:15px;}
  .brandbox .who span{font-size:12px; color:rgba(255,255,255,.72);}

  .navgroup{padding:18px 0 6px;}
  .navlabel{font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase; color:rgba(255,255,255,.5); padding:0 20px 10px;}
  .navitem{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:12px 20px; font-size:14.5px; color:rgba(255,255,255,.86);
    border-left:4px solid transparent; transition:background .15s,color .15s;
  }
  .navitem:hover{background:rgba(255,255,255,.1); color:#fff;}
  .navitem.active{background:rgba(255,255,255,.17); color:#fff; font-weight:600; border-left-color:#fff;}
  .navitem .ico{width:20px; flex-shrink:0; display:flex; justify-content:center;}
  .navitem .caret{margin-left:auto; font-size:10px; transition:transform .2s;}
  .navitem.open .caret{transform:rotate(180deg);}
  .subnav{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .subnav.open{max-height:200px;}
  .subnav .navitem{padding-left:34px; font-size:13.5px; color:rgba(255,255,255,.78);}
  .subnav .navitem .count{
    margin-left:auto; font-size:11px; font-weight:700; background:rgba(255,255,255,.2);
    border-radius:20px; padding:1px 8px;
  }
  .sidefoot{margin-top:auto; padding:18px 20px; font-size:11.5px; color:rgba(255,255,255,.55); border-top:1px solid rgba(255,255,255,.14);}

  .main{flex:1; margin-left:252px; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    display:none; position:sticky; top:0; z-index:50; background:var(--ink); color:#fff;
    padding:12px 16px; align-items:center; gap:12px;
  }
  .topbar b{font-size:15px;}
  .burger{font-size:22px; line-height:1; color:#fff;}
  .scrim{display:none; position:fixed; inset:0; background:rgba(15,20,26,.5); z-index:55;}
  .scrim.show{display:block;}

  .content{padding:26px 30px 60px; max-width:1240px; width:100%;}
  .pagehead{
    background:linear-gradient(100deg,var(--brand) 0%,var(--brand-2) 60%,#17bda6 100%);
    color:#fff; border-radius:14px; padding:24px 28px; margin-bottom:24px; box-shadow:var(--shadow);
  }
  .pagehead h1{font-size:23px; font-weight:700; letter-spacing:.2px;}
  .pagehead p{font-size:14px; color:rgba(255,255,255,.85); margin-top:4px;}

  /* ── STATS ── */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:24px;}
  .stat{
    background:var(--card); border-radius:14px; padding:20px; box-shadow:var(--shadow);
    border-top:4px solid var(--line); display:flex; align-items:center; gap:16px; text-align:left;
    width:100%; transition:transform .15s, box-shadow .15s;
  }
  .stat:hover{transform:translateY(-2px); box-shadow:0 10px 26px rgba(20,24,31,.12);}
  .stat .bubble{
    width:52px; height:52px; border-radius:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .stat > div{min-width:0;}
  .stat .n{font-size:28px; font-weight:700; line-height:1.15;}
  .stat .l{font-size:13px; color:var(--muted);}
  .stat.up{border-top-color:#e0a53c;} .stat.up .bubble{background:var(--amber-bg);}
  .stat.pr{border-top-color:#1aa88f;} .stat.pr .bubble{background:#d9f2ec;}
  .stat.dn{border-top-color:#3b82f6;} .stat.dn .bubble{background:var(--blue-bg);}

  .cols{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;}
  .panel{background:var(--card); border-radius:14px; box-shadow:var(--shadow); overflow:hidden;}
  .panel .body{padding:16px;}

  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .tab{
    padding:8px 16px; border-radius:9px; font-size:13.5px; font-weight:600;
    color:var(--muted); background:var(--soft); transition:.15s;
  }
  .tab:hover{color:var(--brand);}
  .tab.active{background:var(--brand); color:#fff;}

  .rowitem{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:#fbfcfd; border:1px solid var(--line); border-radius:11px;
    padding:14px 16px; margin-bottom:10px; transition:.15s;
  }
  .rowitem:last-child{margin-bottom:0;}
  .rowitem:hover{border-color:var(--brand); background:#fff; transform:translateX(3px);}
  .rowitem .ic{
    width:40px; height:40px; flex-shrink:0; border-radius:10px; background:var(--soft);
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .rowitem > div{min-width:0;}
  .rowitem .nm{font-weight:600; font-size:14.5px; overflow-wrap:anywhere;}
  .rowitem .sub{font-size:12.5px; color:var(--muted); overflow-wrap:anywhere;}

  .chips{display:flex; flex-wrap:wrap; gap:9px; max-height:330px; overflow-y:auto; padding-right:4px;}
  .chip{
    display:inline-flex; align-items:center; gap:8px; background:#fbfcfd;
    border:1px solid var(--line); border-radius:22px; padding:7px 8px 7px 14px; font-size:13px;
  }
  .chip b{
    background:var(--brand); color:#fff; border-radius:20px; min-width:22px; text-align:center;
    font-size:11.5px; padding:2px 7px;
  }
  .chip.alt b{background:var(--grey);}

  /* ── TABLE ── */
  .toolbar{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .toolbar input, .toolbar select{
    font-family:inherit; font-size:14px; color:var(--text); background:var(--card);
    border:1px solid var(--line); border-radius:11px; padding:12px 15px; box-shadow:var(--shadow); outline:none;
  }
  .toolbar input{flex:1; min-width:220px;}
  .toolbar input:focus, .toolbar select:focus{border-color:var(--brand);}

  .tablewrap{background:var(--card); border-radius:14px; box-shadow:var(--shadow); overflow:hidden;}
  .scrollx{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; min-width:760px;}
  thead th{
    background:linear-gradient(100deg,var(--brand) 0%,var(--brand-2) 100%); color:#fff;
    font-size:12.5px; font-weight:700; letter-spacing:.4px; text-align:left; padding:14px 16px; white-space:nowrap;
  }
  tbody td{padding:14px 16px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fafcfc;}
  td.nm{font-weight:600;}
  td.nm .cl{display:block; font-weight:400; font-size:12.5px; color:var(--muted);}
  .pill{display:inline-block; font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:20px; white-space:nowrap;}
  .p-client{background:var(--blue-bg); color:var(--blue);}
  .p-demo{background:var(--amber-bg); color:var(--amber);}
  .p-personal{background:#ede4fb; color:#6d28d9;}
  .p-marketing{background:#fde4ec; color:#be1250;}
  .p-live{background:var(--green-bg); color:var(--green);}
  .p-maintained{background:#d9f2ec; color:#0b6b5c;}
  .p-completed{background:var(--grey-bg); color:var(--grey);}
  .p-progress{background:var(--amber-bg); color:var(--amber);}
  .p-upcoming{background:var(--grey-bg); color:var(--grey);}
  .viewbtn{
    display:inline-flex; align-items:center; gap:7px; background:var(--soft); color:var(--brand);
    font-size:13px; font-weight:600; padding:8px 15px; border-radius:9px; transition:.15s; white-space:nowrap;
  }
  .viewbtn:hover{background:var(--brand); color:#fff;}
  .empty{padding:44px 20px; text-align:center; color:var(--muted); font-size:14px;}
  .tfoot{padding:13px 16px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--line);}

  /* ── MODAL ── */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(15,20,26,.55);
    z-index:100; padding:20px; overflow-y:auto;
  }
  .overlay.show{display:flex; align-items:flex-start; justify-content:center;}
  .modal{
    background:var(--card); border-radius:16px; width:100%; max-width:700px; margin:auto;
    overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.3);
  }
  .modalhead{
    background:linear-gradient(100deg,var(--brand) 0%,var(--brand-2) 100%); color:#fff;
    padding:20px 24px; display:flex; align-items:center; gap:14px;
  }
  .modalhead .ic{
    width:46px; height:46px; border-radius:13px; background:rgba(255,255,255,.2);
    display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0;
  }
  .modalhead > div{min-width:0;}
  .modalhead h3{font-size:18px; font-weight:700;}
  .modalhead p{font-size:13px; color:rgba(255,255,255,.85); overflow-wrap:anywhere;}
  .closebtn{
    margin-left:auto; width:34px; height:34px; border-radius:9px; flex-shrink:0;
    background:rgba(255,255,255,.2); color:#fff; font-size:17px; line-height:1;
  }
  .closebtn:hover{background:rgba(255,255,255,.34);}
  .modalbody{padding:20px 24px 26px;}
  .mtabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; border-bottom:1px solid var(--line); padding-bottom:14px;}
  .mpane{display:none;} .mpane.show{display:block;}
  .kv{display:grid; grid-template-columns:1fr 1fr; gap:18px 20px; margin-bottom:22px;}
  .kv .k{font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-bottom:3px;}
  .kv .v{font-size:14.5px; font-weight:600;}
  .kv .v.big{color:var(--brand); font-size:17px;}
  .kv .full{grid-column:1 / -1;}
  .kv .v.norm{font-weight:400; color:var(--muted); font-size:14px;}
  ul.feat{list-style:none;}
  ul.feat li{position:relative; padding:9px 0 9px 26px; font-size:14px; border-bottom:1px solid var(--line);}
  ul.feat li:last-child{border-bottom:none;}
  ul.feat li:before{content:"▸"; position:absolute; left:4px; color:var(--brand); font-weight:700;}
  .visit{
    display:block; text-align:center; background:var(--brand); color:#fff; font-weight:600; font-size:14.5px;
    padding:14px; border-radius:11px; transition:.15s;
  }
  .visit:hover{background:#0a544d;}
  .visit.off{background:var(--soft); color:var(--muted); cursor:default;}
  .shot{width:100%; border-radius:11px; border:1px solid var(--line); display:block;}
  .note{
    background:var(--soft); border-left:3px solid var(--brand); border-radius:0 9px 9px 0;
    padding:13px 16px; font-size:13.5px; color:var(--muted); margin-top:14px;
  }

  /* ── CONTENT PAGES ── */
  .prose{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:26px;}
  .prose h2{font-size:17px; margin-bottom:6px;}
  .prose p{font-size:14.5px; color:var(--muted); margin-bottom:12px; max-width:70ch;}
  .prose p:last-child{margin-bottom:0;}
  .timeline{list-style:none; margin-top:6px;}
  .timeline li{position:relative; padding:0 0 22px 26px; border-left:2px solid var(--line);}
  .timeline li:last-child{border-left-color:transparent; padding-bottom:0;}
  .timeline li:before{
    content:""; position:absolute; left:-7px; top:5px; width:12px; height:12px;
    border-radius:50%; background:var(--brand); border:2px solid #fff; box-shadow:0 0 0 2px var(--brand);
  }
  .timeline .yr{font-size:11.5px; font-weight:700; letter-spacing:1px; color:var(--brand); text-transform:uppercase;}
  .timeline b{display:block; font-size:15px; margin:1px 0 3px;}
  .timeline span{font-size:14px; color:var(--muted);}
  .svcgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:6px;}
  .svc{border:1px solid var(--line); border-radius:11px; padding:16px; background:#fbfcfd;}
  .svc b{display:block; font-size:14.5px; margin-bottom:4px;}
  .svc span{font-size:13.5px; color:var(--muted);}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%; font-family:inherit; font-size:14.5px; color:var(--text);
    border:1px solid var(--line); border-radius:11px; padding:12px 14px; outline:none; background:#fbfcfd;
  }
  .field textarea{min-height:120px; resize:vertical;}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--brand); background:#fff;}
  .sendrow{display:flex; gap:12px; flex-wrap:wrap;}
  .sendbtn{
    flex:1; min-width:180px; text-align:center; font-weight:600; font-size:14.5px;
    padding:14px; border-radius:11px; transition:.15s;
  }
  .sendbtn.wa{background:#1f9d55; color:#fff;} .sendbtn.wa:hover{background:#187f44;}
  .sendbtn.em{background:var(--brand); color:#fff;} .sendbtn.em:hover{background:#0a544d;}
  .contactlist{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .contactlist a{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    border:1px solid var(--line); border-radius:11px; padding:14px 16px;
    color:var(--text); font-size:14px; font-weight:600; background:#fbfcfd; transition:.15s;
  }
  .contactlist a:hover{border-color:var(--brand); background:#fff;}
  .contactlist a span{min-width:0; overflow-wrap:anywhere;}
  .contactlist a .lbl{font-size:12.5px; letter-spacing:.2px; color:var(--muted); font-weight:600; text-align:right;}

  footer.foot{padding:22px 30px 34px; font-size:12.5px; color:var(--muted); text-align:center;}

  @media (max-width:1000px){
    .cols{grid-template-columns:1fr;}
    .svcgrid{grid-template-columns:1fr;}
  }
  @media (max-width:820px){
    .sidebar{transform:translateX(-100%); transition:transform .25s ease;}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;}
    .topbar{display:flex;}
    .content{padding:18px 16px 50px;}
    .stats{grid-template-columns:1fr; gap:14px;}
    .kv{grid-template-columns:1fr;}
    .pagehead{padding:20px;}
    .pagehead h1{font-size:20px;}
  }
</style>
</head>
<body>

<div class="scrim" id="scrim"></div>

<div class="app">

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar" id="sidebar">
    <div class="brandbox">
      <div class="mark">BD</div>
      <div class="who">
        <b>Mohd Farizal Roslie</b>
        <span>Portfolio</span>
      </div>
    </div>

    <div class="navgroup">
      <div class="navlabel">Main</div>
      <button class="navitem" data-route="dashboard"><span class="ico">📊</span> Dashboard</button>

      <button class="navitem" id="projToggle"><span class="ico">💼</span> Projects <span class="caret">▼</span></button>
      <div class="subnav" id="projSub">
        <button class="navitem" data-route="upcoming"><span class="ico">📁</span> Upcoming <span class="count" id="cUp">0</span></button>
        <button class="navitem" data-route="inprogress"><span class="ico">🚀</span> In Progress <span class="count" id="cPr">0</span></button>

      </div>

      <button class="navitem" data-route="background"><span class="ico">🎓</span> Background</button>
      <button class="navitem" data-route="services"><span class="ico">🧩</span> Services</button>
      <button class="navitem" data-route="contact"><span class="ico">✉️</span> Send Message</button>
    </div>

    <div class="sidefoot">

    </div>
  </aside>

  <!-- ══ MAIN ══ -->
  <div class="main">
    <div class="topbar">
      <button class="burger" id="burger">☰</button>
      <b>Mohd Farizal Roslie</b>
    </div>

    <div class="content" id="view"></div>

</div>

<!-- ══ MODAL ══ -->
<div class="overlay" id="overlay">
  <div class="modal">

      <div>
        <h3>Project Showcase</h3>

      </div>
      <button class="closebtn" id="mClose">✕</button>
    </div>
    <div class="modalbody">
      <div class="mtabs">
        <button class="tab active" data-mtab="details">Details</button>
        <button class="tab" data-mtab="features">Features</button>
        <button class="tab" data-mtab="gallery">Gallery</button>
        <button class="tab" data-mtab="skills">Skills</button>
      </div>
      <div class="mpane show" id="pDetails"></div>
      <div class="mpane" id="pFeatures"></div>
      <div class="mpane" id="pGallery"></div>
      <div class="mpane" id="pSkills"></div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════

  },
  {
    name:"JS Sapphire — Corporate Website",

    summary:"Six-page corporate website built to give an established Sdn Bhd a credible online presence and a clear enquiry path.",
    features:[
      "Six pages — Home, About, Services, Why Us, Clients, Contact",
      "PHP component architecture (shared header, footer, helpers)",

/* ═══ HELPERS ═══ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byBucket = b => PROJECTS.filter(p => p.bucket === b);
const typePill = t => `<span class="pill p-${t.toLowerCase()}">${esc(t)}</span>`;
const statPill = s => `<span class="pill p-${s}">${STATUS_LABEL[s]}</span>`;

function skillCounts(){
  const m = new Map();
  PROJECTS.forEach(p => p.skills.forEach(s => m.set(s, (m.get(s) || 0) + 1)));
  return Array.from(m.entries()).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
function tally(key){
  const m = new Map();
  PROJECTS.forEach(p => m.set(p[key], (m.get(p[key]) || 0) + 1));
  return Array.from(m.entries()).sort((a, b) => b[1] - a[1]);
}

function renderList(mode){
  const src = mode === "highlighted"
    ? PROJECTS.filter(p => p.highlight)
    : PROJECTS.slice().sort((a, b) => {
        const order = { inprogress:0, completed:1, upcoming:2 };
        return order[a.bucket] - order[b.bucket];
      }).slice(0, 6);

  $("#listArea").innerHTML = src.map(p => `
    <button class="rowitem" data-open="${esc(p.name)}">
      <div class="ic">${p.icon}</div>
      <div>
        <div class="nm">${esc(p.name)}</div>

      </div>
    </button>`).join("");

function renderFacts(mode){
  let rows, alt = false;
  if(mode === "skills"){ rows = skillCounts(); }
  else if(mode === "status"){ rows = tally("status").map(([k, v]) => [STATUS_LABEL[k], v]); alt = true; }
  else if(mode === "type"){ rows = tally("type"); alt = true; }
  else { rows = tally("client").filter(r => !/demo|own /i.test(r[0])); alt = true; }

  $("#factArea").innerHTML = rows.map(([k, v]) =>
    `<span class="chip${alt ? " alt" : ""}">${esc(k)} <b>${v}</b></span>`).join("");
}

function viewProjects(bucket){
  const meta = BUCKET_META[bucket];
  const types = Array.from(new Set(byBucket(bucket).map(p => p.type)));
  return `
  <div class="pagehead">
    <h1>${meta.title}</h1>
    <p>${meta.sub}</p>
  </div>
  <div class="toolbar">
    <input type="text" id="q" placeholder="Search projects, clients or technology…" />
    <select id="ft">
      <option value="">All Types</option>
      ${types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("")}
    </select>
  </div>
  <div class="tablewrap">
    <div class="scrollx">
      <table>
        <thead>
          <tr><th>No</th><th>Project Name</th><th>Type</th><th>Status</th><th>Timeline</th><th>View</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="tfoot" id="tfoot"></div>
  </div>`;
}

function renderTable(bucket){
  const q = ($("#q").value || "").toLowerCase().trim();
  const ft = $("#ft").value;
  const rows = byBucket(bucket).filter(p => {
    if(ft && p.type !== ft) return false;
    if(!q) return true;
    return (p.name + " " + p.client + " " + p.summary + " " + p.skills.join(" ")).toLowerCase().includes(q);
  });

  $("#tbody").innerHTML = rows.length ? rows.map((p, i) => `
    <tr>
      <td>${i + 1}</td>
      <td class="nm">${p.icon} ${esc(p.name)}<span class="cl">${esc(p.client)}</span></td>
      <td>${typePill(p.type)}</td>
      <td>${statPill(p.status)}</td>
      <td>${esc(p.timeline)}</td>
      <td><button class="viewbtn" data-open="${esc(p.name)}">👁 View</button></td>
    </tr>`).join("")
    : `<tr><td colspan="6"><div class="empty">No projects match that search.</div></td></tr>`;

  $("#tfoot").textContent = `Showing ${rows.length} of ${byBucket(bucket).length} projects`;
}

  $("#pGallery").innerHTML = p.image
    ? `<img class="shot" src="${esc(p.image)}" alt="${esc(p.name)}" />`
    : `<div class="empty">No screenshots published for this project.${p.confidential ? " Client-confidential work." : ""}</div>`;

  $("#pSkills").innerHTML =

  $$(".mtabs .tab").forEach((t, i) => t.classList.toggle("active", i === 0));

/* ═══ ROUTER ═══ */
function go(route){
  const view = $("#view");
  if(route === "upcoming" || route === "inprogress" || route === "completed"){
    view.innerHTML = viewProjects(route);
    const redraw = () => renderTable(route);
    $("#q").addEventListener("input", redraw);
    $("#ft").addEventListener("change", redraw);
    redraw();
    $("#projSub").classList.add("open");
    $("#projToggle").classList.add("open");
  } else if(route === "background"){
    view.innerHTML = viewBackground();
  } else if(route === "services"){
    view.innerHTML = viewServices();
  } else if(route === "contact"){
    view.innerHTML = viewContact();
    $("#sendWa").addEventListener("click", () => send("wa"));
    $("#sendEm").addEventListener("click", () => send("em"));
  } else {
    route = "dashboard";
    view.innerHTML = viewDashboard();
    renderList("recent");
    renderFacts("skills");
    $("#listTabs").addEventListener("click", e => {
      const b = e.target.closest("[data-list]"); if(!b) return;
      $$("#listTabs .tab").forEach(t => t.classList.toggle("active", t === b));
      renderList(b.dataset.list);
    });
    $("#factTabs").addEventListener("click", e => {
      const b = e.target.closest("[data-fact]"); if(!b) return;
      $$("#factTabs .tab").forEach(t => t.classList.toggle("active", t === b));
      renderFacts(b.dataset.fact);
    });
  }

  $$(".navitem[data-route]").forEach(n => n.classList.toggle("active", n.dataset.route === route));
  if(location.hash.slice(1) !== route) location.hash = route;
  window.scrollTo({ top:0, behavior:"instant" });
  closeSidebar();
}

function send(how){
  const name = $("#fName").value.trim() || "(no name given)";
  const co = $("#fCo").value.trim() || "-";
  const need = $("#fNeed").value;
  const msg = $("#fMsg").value.trim() || "(no details given)";
  const body =
    `Hi Farizal,\n\nName: ${name}\nCompany: ${co}\nLooking for: ${need}\n\nDetails:\n${msg}`;

  if(how === "wa"){
    window.open(`https://wa.me/${ME.wa}?text=${encodeURIComponent(body)}`, "_blank", "noopener");
  } else {
    window.location.href =
      `mailto:${ME.email}?subject=${encodeURIComponent("Enquiry: " + need + " — " + name)}&body=${encodeURIComponent(body)}`;
  }
}

}

$("#cDn").textContent = byBucket("completed").length;

$("#projToggle").addEventListener("click", () => {
  $("#projSub").classList.toggle("open");
  $("#projToggle").classList.toggle("open");
});
$("#burger").addEventListener("click", () => {
  $("#sidebar").classList.toggle("open");
  $("#scrim").classList.toggle("show");
});
$("#scrim").addEventListener("click", closeSidebar);

document.addEventListener("click", e => {
  const nav = e.target.closest("[data-route]");
  if(nav){ go(nav.dataset.route); return; }
  const open = e.target.closest("[data-open]");
  if(open){ openProject(open.dataset.open); return; }
  const mt = e.target.closest("[data-mtab]");
  if(mt){
    $$(".mtabs .tab").forEach(t => t.classList.toggle("active", t === mt));
    const map = { details:"#pDetails", features:"#pFeatures", gallery:"#pGallery", skills:"#pSkills" };
    $$(".mpane").forEach(pane => pane.classList.remove("show"));
    $(map[mt.dataset.mtab]).classList.add("show");
  }
});
$("#mClose").addEventListener("click", closeModal);
$("#overlay").addEventListener("click", e => { if(e.target === $("#overlay")) closeModal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });
window.addEventListener("hashchange", () => go(location.hash.slice(1)));

go(location.hash.slice(1) || "dashboard");
</script>
